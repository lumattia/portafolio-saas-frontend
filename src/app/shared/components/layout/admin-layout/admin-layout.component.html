<div class="layout">
  <app-header
    [onSidenavClick]="toggleSidenav">
  </app-header>

  @if (viewModeService.isAdminMode() && publishMessage()) {
    <div class="publish-message {{ publishMessage()!.type }}">
      {{ publishMessage()!.text }}
    </div>
  }

  <div class="main-content">
    <aside class="sidebar desktop-only">
      <div class="sidebar-header">
        <app-button variant="icon" (onClick)="openSidebarMenuEditor()" title="Editar menú lateral">
          <app-icon name="edit" size="sm" />
        </app-button>
      </div>
      <app-sidebar-menu-renderer [menu]="sidebarMenu()" />
    </aside>
    <main class="content">
      <app-page-editor />
    </main>
  </div>

  <footer class="footer">
    <div class="footer-header">
      <app-button variant="icon" (onClick)="openFooterMenuEditor()" title="Editar menú footer">
        <app-icon name="edit" size="sm" />
      </app-button>
    </div>
    <app-footer-menu-renderer [menu]="footerMenu()" />
  </footer>

  @if (showSidenav()) {
    <div class="sidenav-overlay mobile-only" (click)="toggleSidenav()"></div>
    <aside class="sidenav mobile-only">
      <div class="sidenav-header">
        <button type="button" class="close-button" (click)="toggleSidenav()">×</button>
      </div>
      @if (sidebarMenu()) {
        <app-sidebar-menu-renderer [menu]="sidebarMenu()" />
      }
    </aside>
  }
</div>
