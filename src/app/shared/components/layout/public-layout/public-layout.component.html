<div class="layout">
  <app-header
    [onSidenavClick]="toggleSidenav">
  </app-header>

  <div class="main-content">
    @if (sidebarMenu()?.menuItems?.length) {
      <aside class="sidebar desktop-only">
        <app-sidebar-menu-renderer [menu]="sidebarMenu()" />
      </aside>
    }
    <main class="content">
      <app-portfolio-page />
    </main>
  </div>

  @if (footerMenu()?.menuItems?.length) {
    <footer class="footer">
      <app-footer-menu-renderer [menu]="footerMenu()" />
    </footer>
  }

  @if (showSidenav()) {
    <div class="sidenav-overlay mobile-only" (click)="toggleSidenav()"></div>
    <aside class="sidenav mobile-only">
      <div class="sidenav-header">
        <button type="button" class="close-button" (click)="toggleSidenav()">×</button>
      </div>
      @if (sidebarMenu()) {
        <app-sidebar-menu-renderer [menu]="sidebarMenu()" />
      }
    </aside>
  }
</div>
