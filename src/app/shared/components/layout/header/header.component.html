<header class="shared-header">
  <div class="header-left">
    <a routerLink="/" class="brand">Portfolio</a>
    <app-header-menu-renderer/>
  </div>
  <div class="header-right">
    <app-theme-toggle />
    <div class="user-card-container">
      @if (auth.isAuthenticated()) {
        <app-popup
          [showArrow]="false"
          [position]="'bottom-right'"
          [trigger]="'click'"
          [closeOnClickOutside]="true">
          <div class="user-card" [class.highlighting]="isUserCardHighlighting()" popup-trigger data-trigger-type="click">
            <div class="user-info">
              <div class="user-email">{{ auth.user()?.email }}</div>
            </div>
            <app-icon name="chevron-right" size="sm" />
          </div>
          <div class="popup-menu">
            <app-popup
              [showArrow]="true"
              [position]="'left-top'"
              [trigger]="'hover'"
              [closeOnClickOutside]="false">
              <div class="view-mode-trigger" popup-trigger data-trigger-type="hover">
                <app-icon name="eye" size="sm" />
                <span>View Mode</span>
                <app-icon name="chevron-right" size="sm" />
              </div>
              <div class="view-mode-options">
                <app-button variant="icon" icon="edit" size="sm" [active]="viewModeService.isAdminMode()" (onClick)="setViewMode('admin')">
                  <span>Modo Edición</span>
                </app-button>
                <app-button variant="icon" icon="eye" size="sm" [active]="viewModeService.isPreviewMode()" (onClick)="setViewMode('preview')">
                  <span>Vista Previa</span>
                </app-button>
                <app-button variant="icon" icon="globe" size="sm" [active]="viewModeService.isSnapshotMode()" (onClick)="setViewMode('snapshot')">
                  <span>Vista Publicada</span>
                </app-button>
              </div>
            </app-popup>
            <app-button variant="icon" icon="upload" size="sm" [disabled]="!viewModeService.isAdminMode() || isPublishing()" (onClick)="publishSite()">
              <span>Publicar</span>
            </app-button>
            <app-button variant="icon" icon="image" size="sm" url="/media-gallery">
              <span>Gallery</span>
            </app-button>
            <app-button variant="icon" icon="table" size="sm" [disabled]="true">
              <span>Table</span>
            </app-button>
            <app-button variant="icon"icon="building" size="sm" [disabled]="true">
              <span>Tenant</span>
            </app-button>
            <app-button variant="icon"icon="menu" size="sm" (onClick)="openToolbar()">
              <span>Toolbar</span>
            </app-button>
            <app-button variant="icon" icon="close" size="sm" (onClick)="logout()">
              <span>Salir</span>
            </app-button>
          </div>
        </app-popup>
      } @else {
        <div class="login-card" (click)="navigateToLogin()">
          <span>Login</span>
        </div>
      }
    </div>
  </div>
</header>

@if (auth.isAuthenticated()) {
  <app-draggable-toolbar>
    <app-button variant="icon" icon="close" size="sm" (onClick)="onToolbarClose()">
    </app-button>
    <div class="toolbar-view-selector">
      <app-button
        variant="icon"
        [active]="viewModeService.isAdminMode()"
        (onClick)="setViewMode('admin')"
        icon="edit" size="sm"
        title="Modo Edición">
      </app-button>
      <app-button
        variant="icon"
        [active]="viewModeService.isPreviewMode()"
        (onClick)="setViewMode('preview')"
        icon="eye" size="sm"
        title="Vista Previa">
      </app-button>
      <app-button
        variant="icon"
        [active]="viewModeService.isSnapshotMode()"
        (onClick)="setViewMode('snapshot')"
        icon="globe" size="sm"
        title="Vista Publicada">
      </app-button>
    </div>
    <app-button
      variant="icon"
      [disabled]="!viewModeService.isAdminMode() || isPublishing()"
      (onClick)="publishSite()"
      [icon]="isPublishing()?'loader':'upload'" size="sm"
      title="Publicar">
    </app-button>
  </app-draggable-toolbar>
}
