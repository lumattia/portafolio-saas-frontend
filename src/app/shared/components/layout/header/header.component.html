<header class="shared-header">
  <div class="header-left">
    <a routerLink="/" class="brand">Portfolio</a>
    <app-header-menu-renderer/>
  </div>
  <div class="header-right">
    @if (viewModeService.isSnapshotMode() && auth.isAuthenticated()) {
      <app-select-input
        class="version-select"
        [options]="versions()"
        [value]="viewModeService.snapshotVersion()"
        [showSearch]="false"
        placeholderKey="shared.selectInput.placeholder"
        (valueChange)="onSnapshotVersionChange($event)">
      </app-select-input>
    }
    <app-theme-toggle />
    <div class="user-card-container">
      @if (auth.isAuthenticated()) {
        <app-popup
          [showArrow]="false"
          [position]="'bottom-right'"
          [trigger]="'click'"
          [closeOnClickOutside]="true">
          <div class="user-card" [class.highlighting]="isUserCardHighlighting()" popup-trigger data-trigger-type="click">
            <div class="user-info">
              <div class="user-email">{{ auth.user()?.email }}</div>
            </div>
            <app-icon name="chevron-right" size="sm" />
          </div>
          <div class="popup-menu">
            <app-popup
              [showArrow]="true"
              [position]="'left-top'"
              [trigger]="'hover'"
              [closeOnClickOutside]="false">
              <app-button variant="icon" popup-trigger>
                <div class="view-mode-trigger" data-trigger-type="hover">
                  <app-icon name="eye"/>
                  <span>View Mode</span>
                  <app-icon name="chevron-right"/>
                </div>
              </app-button>

              <div >
                <app-button variant="icon" icon="edit" [active]="viewModeService.isDraftMode()" (onClick)="setViewMode('draft')">
                  <span>Modo Edición</span>
                </app-button>
                <app-button variant="icon" icon="globe" [active]="viewModeService.isPublishedMode()" (onClick)="setViewMode('published')">
                  <span>Vista Publicada</span>
                </app-button>
                <app-button variant="icon" icon="eye" [active]="viewModeService.isSnapshotMode()" (onClick)="setViewMode('snapshot')">
                  <span>Vista Previa</span>
                </app-button>
              </div>
            </app-popup>
            <app-button variant="icon" icon="upload" [disabled]="!viewModeService.isDraftMode() || isPublishing()" (onClick)="publishSite()">
              <span>Publicar</span>
            </app-button>
            <app-button variant="icon" icon="image" url="/media-gallery">
              <span>Gallery</span>
            </app-button>
            <app-button variant="icon" icon="table" url="/tables/pages">
              <span>Table</span>
            </app-button>
            <app-button variant="icon"icon="menu" (onClick)="openToolbar()">
              <span>Toolbar</span>
            </app-button>
            <app-button variant="icon" icon="close" (onClick)="logout()">
              <span>Salir</span>
            </app-button>
          </div>
        </app-popup>
      } @else {
        <div class="login-card" (click)="navigateToLogin()">
          <span>Login</span>
        </div>
      }
    </div>
  </div>
</header>

@if (auth.isAuthenticated()) {
  <app-draggable-toolbar>
    <app-button variant="icon" icon="close" size="sm" (onClick)="onToolbarClose()">
    </app-button>
    <div class="toolbar-view-selector">
      <app-button
        variant="icon"
        [active]="viewModeService.isDraftMode()"
        (onClick)="setViewMode('draft')"
        icon="edit" size="sm"
        title="Modo Edición">
      </app-button>
      <app-button
        variant="icon"
        [active]="viewModeService.isPublishedMode()"
        (onClick)="setViewMode('published')"
        icon="globe" size="sm"
        title="Vista Publicada">
      </app-button>
      <app-button
        variant="icon"
        [active]="viewModeService.isSnapshotMode()"
        (onClick)="setViewMode('snapshot')"
        icon="eye" size="sm"
        title="Vista Previa">
      </app-button>
    </div>
    <app-button
      variant="icon"
      [disabled]="!viewModeService.isDraftMode() || isPublishing()"
      (onClick)="publishSite()"
      [icon]="isPublishing()?'loader':'upload'" size="sm"
      title="Publicar">
    </app-button>
  </app-draggable-toolbar>
}
