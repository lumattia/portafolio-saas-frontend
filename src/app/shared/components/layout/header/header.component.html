<header class="shared-header">
  <div class="header-left">
    <button type="button" class="menu-button" (click)="onSidenavClick()" title="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a routerLink="/" class="brand">Portfolio</a>
    <app-header-menu-renderer/>
  </div>
  <div class="header-right">
    <app-theme-toggle />
    <div class="user-card-container">
      @if (auth.isAuthenticated()) {
        <app-popup
          [showArrow]="false"
          [position]="'bottom-right'"
          [trigger]="'click'"
          [closeOnClickOutside]="true">
          <div class="user-card" [class.highlighting]="isUserCardHighlighting()" popup-trigger data-trigger-type="click">
            <div class="user-info">
              <div class="user-email">{{ auth.user()?.email }}</div>
            </div>
            <app-icon name="chevron-right" size="sm" />
          </div>
          <div class="popup-menu">
            <app-popup
              [showArrow]="true"
              [position]="'left-top'"
              [trigger]="'hover'"
              [closeOnClickOutside]="false">
              <div class="view-mode-trigger" popup-trigger data-trigger-type="hover">
                <app-icon name="eye" size="sm" />
                <span>View Mode</span>
                <app-icon name="chevron-left" size="sm" />
              </div>
              <div class="view-mode-options">
                <app-button variant="icon" [active]="viewModeService.isAdminMode()" (onClick)="setViewMode('admin')">
                  <app-icon name="edit" size="sm" />
                  <span>Modo Edición</span>
                </app-button>
                <app-button variant="icon" [active]="viewModeService.isPreviewMode()" (onClick)="setViewMode('preview')">
                  <app-icon name="eye" size="sm" />
                  <span>Vista Previa</span>
                </app-button>
                <app-button variant="icon" [active]="viewModeService.isSnapshotMode()" (onClick)="setViewMode('snapshot')">
                  <app-icon name="globe" size="sm" />
                  <span>Vista Publicada</span>
                </app-button>
              </div>
            </app-popup>
            <app-button variant="icon" [disabled]="!viewModeService.isAdminMode() || isPublishing()" (onClick)="publishSite()">
              <app-icon name="upload" size="sm" />
              <span>Publicar</span>
            </app-button>
            <app-button variant="icon" [disabled]="true">
              <app-icon name="table" size="sm" />
              <span>Table</span>
            </app-button>
            <app-button variant="icon" [disabled]="true">
              <app-icon name="building" size="sm" />
              <span>Tenant</span>
            </app-button>
            <app-button variant="icon" (onClick)="openToolbar()">
              <app-icon name="menu" size="sm" />
              <span>Toolbar</span>
            </app-button>
            <app-button variant="icon" (onClick)="logout()">
              <app-icon name="close" size="sm" />
              <span>Salir</span>
            </app-button>
          </div>
        </app-popup>
      } @else {
        <div class="login-card" (click)="navigateToLogin()">
          <span>Login</span>
        </div>
      }
    </div>
  </div>
</header>

@if (auth.isAuthenticated()) {
  <app-draggable-toolbar>
    <app-button variant="icon" (onClick)="onToolbarClose()">
      <app-icon name="close" size="sm" />
    </app-button>
    <div class="toolbar-view-selector">
      <app-button
        variant="icon"
        [active]="viewModeService.isAdminMode()"
        (onClick)="setViewMode('admin')"
        title="Modo Edición">
        <app-icon name="edit" size="sm" />
      </app-button>
      <app-button
        variant="icon"
        [active]="viewModeService.isPreviewMode()"
        (onClick)="setViewMode('preview')"
        title="Vista Previa">
        <app-icon name="eye" size="sm" />
      </app-button>
      <app-button
        variant="icon"
        [active]="viewModeService.isSnapshotMode()"
        (onClick)="setViewMode('snapshot')"
        title="Vista Publicada">
        <app-icon name="globe" size="sm" />
      </app-button>
    </div>
    <app-button
      variant="icon"
      [disabled]="!viewModeService.isAdminMode() || isPublishing()"
      (onClick)="publishSite()"
      title="Publicar">
      @if (isPublishing()) {
        <app-icon name="loader" size="sm" />
      } @else {
        <app-icon name="upload" size="sm" />
      }
    </app-button>
  </app-draggable-toolbar>
}
