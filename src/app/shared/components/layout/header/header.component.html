<header class="shared-header">
  <div class="header-left">
    <button type="button" class="menu-button" (click)="onSidenavClick()" title="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a routerLink="/" class="brand">Portfolio</a>
    <app-header-menu-renderer/>
  </div>
  <div class="header-right">
    <app-theme-toggle />
    <div class="user-card-container">
      @if (auth.isAuthenticated()) {
        <app-popup
          [showArrow]="false"
          [position]="'bottom-right'"
          [trigger]="'click'"
          [closeOnClickOutside]="true">
          <div class="user-card" popup-trigger data-trigger-type="click">
            <div class="user-info">
              <div class="user-email">{{ auth.user()?.email }}</div>
            </div>
            <app-icon name="chevron-right" size="sm" />
          </div>
          <div class="popup-menu">
            <app-popup
              [showArrow]="true"
              [position]="'left-top'"
              [trigger]="'hover'"
              [closeOnClickOutside]="false">
              <div class="view-mode-trigger" popup-trigger data-trigger-type="hover">
                <app-icon name="eye" size="sm" />
                <span>View Mode</span>
                <app-icon name="chevron-left" size="sm" />
              </div>
              <div class="view-mode-options">
                <app-button variant="ghost" class="dropdown-item" [class.active]="viewModeService.isAdminMode()" (onClick)="setViewMode('admin')">
                  <app-icon name="edit" size="sm" />
                  <span>Modo Edición</span>
                </app-button>
                <app-button variant="ghost" class="dropdown-item" [class.active]="viewModeService.isPreviewMode()" (onClick)="setViewMode('preview')">
                  <app-icon name="eye" size="sm" />
                  <span>Vista Previa</span>
                </app-button>
                <app-button variant="ghost" class="dropdown-item" [class.active]="viewModeService.isSnapshotMode()" (onClick)="setViewMode('snapshot')">
                  <app-icon name="globe" size="sm" />
                  <span>Vista Publicada</span>
                </app-button>
              </div>
            </app-popup>
            <app-button variant="ghost" class="dropdown-item" [disabled]="!viewModeService.isAdminMode() || isPublishing()" (onClick)="publishSite()">
              <app-icon name="upload" size="sm" />
              <span>Publicar</span>
            </app-button>
            <app-button variant="ghost" class="dropdown-item" [disabled]="true">
              <app-icon name="table" size="sm" />
              <span>Table</span>
            </app-button>
            <app-button variant="ghost" class="dropdown-item" [disabled]="true">
              <app-icon name="building" size="sm" />
              <span>Tenant</span>
            </app-button>
            <app-button variant="ghost" class="dropdown-item" (onClick)="openToolbar()">
              <app-icon name="menu" size="sm" />
              <span>Toolbar</span>
            </app-button>
            <app-button variant="ghost" class="dropdown-item" (onClick)="logout()">
              <app-icon name="close" size="sm" />
              <span>Salir</span>
            </app-button>
          </div>
        </app-popup>
      } @else {
        <div class="login-card" (click)="navigateToLogin()">
          <span>Login</span>
        </div>
      }
    </div>
  </div>
</header>

@if (showToolbar() && auth.isAuthenticated()) {
  <div
    class="draggable-toolbar"
    [class.closing]="isToolbarClosing()"
    [style.left.px]="toolbarLeft()"
    [style.top.px]="toolbarTop()">
    <div class="toolbar-content">
      <button type="button" class="close-button" (click)="closeToolbarWithAnimation()">
        <app-icon name="close" size="sm" />
      </button>
      <div class="toolbar-view-selector">
        <button
          type="button"
          class="toolbar-icon"
          [class.active]="viewModeService.isAdminMode()"
          (click)="setViewMode('admin')"
          title="Modo Edición">
          <app-icon name="edit" size="sm" />
        </button>
        <button
          type="button"
          class="toolbar-icon"
          [class.active]="viewModeService.isPreviewMode()"
          (click)="setViewMode('preview')"
          title="Vista Previa">
          <app-icon name="eye" size="sm" />
        </button>
        <button
          type="button"
          class="toolbar-icon"
          [class.active]="viewModeService.isSnapshotMode()"
          (click)="setViewMode('snapshot')"
          title="Vista Publicada">
          <app-icon name="globe" size="sm" />
        </button>
      </div>
      <button
        type="button"
        class="toolbar-icon"
        [disabled]="!viewModeService.isAdminMode() || isPublishing()"
        (click)="publishSite()"
        title="Publicar">
        @if (isPublishing()) {
          <app-icon name="loader" size="sm" />
        } @else {
          <app-icon name="upload" size="sm" />
        }
      </button>
    </div>
  </div>
}
