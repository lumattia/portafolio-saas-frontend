
<div class="modal-content" [class]="'type-' + type">
  <div class="modal-header">
    <h3>{{ title | translate }}</h3>
    <app-button variant="icon" icon="close" size="md" (onClick)="close?.()">
    </app-button>
  </div>
  <div class="modal-body">
    <p class="error-message">{{ message | translate:translateParams }}</p>
  </div>
  <div class="modal-footer">
    <app-button (onClick)="onConfirm()">OK</app-button>
  </div>
</div>
