<div class="modal-content" (click)="$event.stopPropagation()">
  <div class="modal-header">
    <h3>{{ 'unsavedChanges.title' | translate }}</h3>
    <app-button variant="icon" (onClick)="onStayClick()">
      <app-icon name="close" size="md" />
    </app-button>
  </div>
  <div class="modal-body">
    <p>{{ 'unsavedChanges.message' | translate }}</p>
  </div>
  <div class="modal-footer">
    <app-button variant="secondary" (onClick)="onLeaveClick()">{{ 'unsavedChanges.leave' | translate }}</app-button>
    <app-button (onClick)="onStayClick()">{{ 'unsavedChanges.stay' | translate }}</app-button>
  </div>
</div>
