<div class="media-input-wrapper" [class.readonly]="readonly()">
  @if (media()) {
    <div class="media-selected-state">
      <div class="media-preview" [style]="previewStyles()">
        <img [src]="media()!.url" [alt]="media()!.fileName" />
      </div>

      <div class="media-controls">
        <div class="dimension-inputs">
          <app-dimension-input
            dimensionType="width"
            [label]="'Width'"
            [(dimension)]="boxDimension().width"
            (dimensionChange)="notifySignal(boxDimension)"
            [autoClamp]="true"
          />
          <app-dimension-input
            dimensionType="height"
            [label]="'Height'"
            [(dimension)]="boxDimension().height"
            (dimensionChange)="notifySignal(boxDimension)"
            [autoClamp]="true"
          />
        </div>
        <div class="action-buttons">
          @if (!readonly()) {
            <app-button (onClick)="openMediaSelector()">Change</app-button>
            <app-button variant="danger" (onClick)="removeSelectedMedia()">Remove</app-button>
          }
        </div>
      </div>
    </div>
  } @else {
    <div class="empty-state" (click)="openMediaSelector()">
      <div class="placeholder-content">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="placeholder-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
        <span class="placeholder-text">Select Media from Gallery</span>
      </div>
    </div>
  }
</div>
