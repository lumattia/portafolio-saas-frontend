<div class="color-input-wrapper">
  @if (labelKey()) {
    <label class="color-input-label">
      {{ labelKey() | translate }}
      @if (!readonly() && required()) {
        <span class="required-mark">*</span>
      }
    </label>
  }
  <div class="color-input-container">
    <input
      type="color"
      [formControl]="control"
      [attr.disabled]="disabled() || readonly() ? true : null"
      [readonly]="readonly()"
      class="color-input-field"
      [class.error]="shouldShowError"
      [class.dirty]="isDirty"
      (input)="onValueChange($event)"
      (change)="onValueChange($event)"
    />
    <input
      type="text"
      [formControl]="control"
      [attr.disabled]="disabled() || readonly() ? true : null"
      [readonly]="readonly()"
      class="color-text-field"
      [class.error]="shouldShowError"
      [class.dirty]="isDirty"
      placeholder="#000000"
      (input)="onValueChange($event)"
      (change)="onValueChange($event)"
      (blur)="onBlur()"
    />
  </div>
  @if (shouldShowError && errorMessage) {
    <span class="color-input-error">
      {{ errorMessage.key | translate: errorMessage.params }}
    </span>
  }
</div>
