<app-text-input
  [type]="type"
  [labelKey]="labelKey"
  [placeholderKey]="placeholderKey"
  [control]="control"
  [required]="required"
  [disabled]="disabled"
  [readonly]="readonly"
  [minLength]="minLength"
  [maxLength]="maxLength"
  [pattern]="pattern"
>
  <app-button
    variant="icon"
    size="md"
    suffix
    (onClick)="toggleVisibility()"
    [icon]="showPassword ? 'eye-off' : 'eye'"
    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
  >
  </app-button>
</app-text-input>
