<ng-template #menuRenderer let-items="items">
  <nav class="sidebar-menu-renderer">
    @for (item of items; track item.id) {
      <div class="menu-item-wrapper">
        <a
          [smartLink]="item"
          class="menu-item">
          <div class="menu-item-content">
            <span class="menu-item-text">{{ item.text }}</span>
          </div>
          @if (item.subMenuItems.length > 0) {
            <app-icon name="chevron-right" size="sm" [class.rotate]="item.toggled" />
          }
        </a>
        @if (item.toggled && item.subMenuItems.length > 0) {
          <div class="submenu-container">
            @for (child of item.subMenuItems; track child.id) {
              <a
                [smartLink]="child"
                class="submenu-item">
                {{ child.text }}
              </a>
            }
          </div>
        }
      </div>
    }
  </nav>

</ng-template>
@if (viewModeService.isAdminMode()) {
  <aside class="sidebar desktop-only">
    <app-button class="edit-btn" variant="icon" (onClick)="openMenuEditor()" title="Editar menú header">
      <app-icon name="edit" size="sm" />
    </app-button>
    <ng-container
      *ngTemplateOutlet="menuRenderer; context: { items: menu()?.menuItems }">
    </ng-container>
  </aside>
}@else if(menu()?.menuItems?.length){
  <aside class="sidebar desktop-only">
    <ng-container
      *ngTemplateOutlet="menuRenderer; context: { items: menu()?.menuItems }">
    </ng-container>
  </aside>
}
