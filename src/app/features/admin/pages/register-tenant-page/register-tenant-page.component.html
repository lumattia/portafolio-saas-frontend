<div class="card">
  <a routerLink="/admin" class="back">← Volver</a>
  <h1>Crear cuenta para otro usuario</h1>
  <p class="hint">Solo para administradores. El dominio será su dirección web (ej: maria.localhost).</p>
  <div class="form">
    <app-email-input
      [control]="form.controls.email"
    />
    <app-password-input
      labelKey="Contraseña inicial"
      [control]="form.controls.password"
    />
    <app-text-input
      labelKey="Su dominio web"
      placeholderKey="maria.localhost"
      type="text"
      [control]="form.controls.configuredDomain"
    />

    @if (message()) {
      <p class="success">{{ message() }}</p>
    }
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <br>
    <app-button [disabled]="loading() || form.invalid" (onClick)="submit()">
      {{ loading() ? 'Creando…' : 'Crear cuenta' }}
    </app-button>
  </div>
</div>
