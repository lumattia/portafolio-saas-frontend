<div class="login-card">
  <h1>Entrar a mis proyectos</h1>
  <p class="hint">Usa el email y la contraseña que te dieron.</p>
  <div>
    <app-email-input
      labelKey="Tu email"
      placeholderKey="nombre@ejemplo.com"
      [control]="form.controls.email"
      autocomplete="username"
    />
    <app-password-input
      labelKey="Tu contraseña"
      placeholderKey="••••••••"
      [control]="form.controls.password"
      autocomplete="current-password"
    />

    @if (error()) {
      <p class="error">Email o contraseña incorrectos.</p>
    }
    <br>
    <app-button [disabled]="loading() || form.invalid" (onClick)="submit()">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </app-button>
  </div>
</div>
