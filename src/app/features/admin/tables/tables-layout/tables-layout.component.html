<div class="tables-layout">
  <nav class="tables-nav">
    @for (table of tables; track table.path) {
      <a
        [routerLink]="table.path"
        routerLinkActive="active"
        class="tables-nav-item">
        <img [src]="'/assets/icons/' + table.icon + '.svg'" [alt]="table.name" class="sm" />
        <span>{{ table.name }}</span>
      </a>
    }
  </nav>
  <router-outlet></router-outlet>
</div>
