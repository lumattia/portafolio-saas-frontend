<div class="template-selector">
  <div class="header">
    <h2>Add Section</h2>
    <app-button variant="icon" icon="close" (onClick)="dismiss('backdrop')"/>
  </div>

  <div class="filters">
    <app-text-input
      [placeholderKey]="'Search templates...'"
      [value]="searchQuery()"
      (valueChange)="onSearch($event)"
    />
    <app-select-input
      [options]="categoryOptions()"
      [value]="selectedCategory()"
      (valueChange)="onCategoryChange($event)"
      [showSearch]="false"
    ></app-select-input>
  </div>

  @if (isLoading()) {
    <div class="loading">Loading templates...</div>
  } @else {
    <div class="templates-grid">
      @for (template of templates(); track template.id) {
        <div class="template-card" (click)="selectTemplate(template)">
          <div class="template-preview">
            @if (template.previewImageUrl) {
              <img [src]="template.previewImageUrl" [alt]="template.name" />
            } @else {
              <div class="placeholder-preview">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2" />
                  <path stroke-width="2" d="M3 9h18" />
                  <path stroke-width="2" d="M9 21V9" />
                </svg>
              </div>
            }
          </div>
          <div class="template-info">
            <h3>{{ template.name }}</h3>
            <div class="template-tags">
              @for (tag of template.categoryTags.split(','); track tag) {
                <span class="tag">{{ tag }}</span>
              }
            </div>
          </div>
        </div>
      } @empty {
        <div class="no-results">No templates found</div>
      }
    </div>
    <app-pagination
      [page]="pagedParameters()"
      (pageChanged)="loadTemplates()"
    />
  }
</div>
