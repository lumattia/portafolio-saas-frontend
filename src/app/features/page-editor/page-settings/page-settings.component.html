<div class="page-settings">
  <h2>Page Settings</h2>

  <div class="form-group">
    <app-text-input
      labelKey="Title"
      placeholderKey="Page title"
      [control]="titleControl"
    />
  </div>

  <div class="form-group">
    <app-text-input
      labelKey="Slug"
      placeholderKey="page-slug"
      [control]="slugControl"
    />
  </div>

  <div class="form-group">
    <app-text-input
      labelKey="Meta Description"
      placeholderKey="SEO meta description"
      type="text"
      [control]="metaDescriptionControl"
    />
  </div>

  <div class="form-actions">
    <app-button
      variant="secondary"
      (onClick)="cancel()"
    >
      Cancel
    </app-button>
    <app-button
      variant="primary"
      (onClick)="save()"
    >
      @if (!pageId()) {
        Create
      } @else {
        Save
      }
    </app-button>
  </div>
</div>
