<div class="section-editor-content">
  <app-subsection-selector [section]="section()"></app-subsection-selector>
  <app-collapsible
        label="Style"
      >
          <app-dimension-input
      dimensionType="width"
      [label]="'Width'"
      [(value)]="content.styles.width.value"
      [(unit)]="content.styles.width.unit"
      [autoClamp]="true"
      [sectionId]="section().id"
    />
    <app-dimension-input
      dimensionType="height"
      [label]="'Height'"
      [(value)]="content.styles.height.value"
      [(unit)]="content.styles.height.unit"
      [autoClamp]="true"
    />
    </app-collapsible>

  <app-button variant="danger" size="sm" (onClick)="deleteSection()">
    @if (section().isDeleted) { Undo } @else { Delete Section }
  </app-button>
</div>
