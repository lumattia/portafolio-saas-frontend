<div class="flex-layout-container" [ngStyle]="containerStyle">
  @for (subSection of subSections;  track $index) {
    <app-section-renderer
      [section]="subSection"
      [isSelected]="section().subSectionIndex == $index"
      (select)="onSubsectionSelect($index)"
    />
  }@empty {
    <div class="placeholder">Empty flex</div>
  }
</div>
