<div class="image-section-editor">
  @if (content && content.inputs) {
    <div class="field-group">
      <label>Image</label>
          <app-image-input
            [existingImageUrl]="imageUrl"
            [originalFileName]="section().file?.fileName"
            [maxHeight]="600"
            [minAspectRatio]="0"
            [maxAspectRatio]="6/1"
            (fileChanged)="onFileChange($event)"
          />
    </div>
  }
  <app-button variant="danger" size="sm" (click)="deleteSection()">
    @if (section().isDeleted) { Undo } @else { Delete Section }
  </app-button>
</div>
