<div class="section-editor-content">
  @if (content && content.inputs) {
    <div class="field-group">
      <label>Image</label>
          <app-image-input
            [existingImageUrl]="imageUrl"
            [originalFileName]="section().file?.fileName"
            [maxHeight]="600"
            [minAspectRatio]="0"
            [maxAspectRatio]="6/1"
            (fileChanged)="onFileChange($event)"
          />
    </div>
    <app-dimension-input
      dimensionType="width"
      [label]="'Width'"
      [(value)]="content.styles.width.value"
      [(unit)]="content.styles.width.unit"
      [autoClamp]="true"
      [sectionId]="section().id"
    />
  }
  <app-button variant="danger" size="sm" (onClick)="deleteSection()">
    @if (section().isDeleted) { Undo } @else { Delete Section }
  </app-button>
</div>
