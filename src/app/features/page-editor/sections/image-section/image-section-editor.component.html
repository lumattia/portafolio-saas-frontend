<div class="section-editor-content">
  @if (content.inputs) {
    <div class="field-group">
      <label>Image</label>
        <app-media-input
            [(media)]="section().media"
            [maxHeight]="600"
            [minAspectRatio]="0"
            [maxAspectRatio]="6/1"
            [(boxDimension)]="content.inputs.media"
          />
    </div>
    <app-dimension-input
      dimensionType="width"
      [label]="'Width'"
      [(dimension)]="content.styles.width"
      (dimensionChange)="notifySignal()"
      [autoClamp]="true"
      [sectionId]="section().id"
    />
  }
  <app-button variant="danger" size="sm" (onClick)="deleteSection()">
    @if (section().isDeleted) { Undo } @else { Delete Section }
  </app-button>
</div>
