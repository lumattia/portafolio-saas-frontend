<div class="section-editor-content">
   <div class="info-message">
      <p>The dashed border helps you identify this blank section while editing. It won't be visible to visitors.</p>
    </div>
  <app-dimension-input
    dimensionType="height"
    [label]="'Height'"
    [(dimension)]="content.styles.height"
    (dimensionChange)="notifySignal()"
    [autoClamp]="true"
    [sectionId]="section().id"
  />
  <app-dimension-input
    dimensionType="width"
    [label]="'Width'"
    [(dimension)]="content.styles.width"
    (dimensionChange)="notifySignal()"
    [autoClamp]="true"
    [sectionId]="section().id"
  />
  <app-button variant="danger" size="sm" (onClick)="deleteSection()">
    @if (section().isDeleted) { Undo } @else { Delete Section }
  </app-button>
</div>
