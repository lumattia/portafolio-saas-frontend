<div class="section-editor-content">
  @if (content.inputs) {
    <div class="field-group">
      <label>Text</label>
      <app-rich-text-input
        [(value)]="content.inputs.text"
        placeholder="Enter text..."
      />
    </div>
  }
  <app-dimension-input
    dimensionType="width"
    [label]="'Width'"
    [(dimension)]="content.styles.width"
    [autoClamp]="true"
    [sectionId]="section().id"
  />
  <app-button variant="danger" size="sm" (onClick)="deleteSection()">
    @if (section().isDeleted) { Undo } @else { Delete Section }
  </app-button>
</div>
